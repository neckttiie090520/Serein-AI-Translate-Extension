version: 2
updates:
  # Cargo.lock is the source of truth; monthly cadence keeps rebases reviewable.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

