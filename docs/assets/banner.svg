<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101024"/>
      <stop offset="1" stop-color="#1B1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1150" cy="40" r="180" fill="#7C5CFF" opacity="0.08"/>
  <circle cx="120" cy="300" r="150" fill="#22D3EE" opacity="0.07"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- logo mark -->
  <g transform="translate(72,64)">
    <rect x="0" y="0" width="192" height="192" rx="44" fill="url(#globe)"/>
    <circle cx="96" cy="84" r="42" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <ellipse cx="96" cy="84" rx="18" ry="42" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.85"/>
    <path d="M 56 72 H 136 M 56 96 H 136 M 60 112 Q 96 128 132 112" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.7"/>
    <path d="M 44 156 H 144 L 128 140 M 144 156 L 128 172" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 148 180 H 48 L 64 164 M 48 180 L 64 196" fill="none" stroke="#0E7490" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="140" fill="#FFFFFF" font-size="58" font-weight="700">Serein Translate</text>
  <text x="322" y="188" fill="#B9B9D6" font-size="26">On-device LLM translation for the Serein Discord client</text>
  <text x="322" y="228" fill="#8B8BB0" font-size="21">Inline · Auto-translate · Context-aware · Zero cloud APIs</text>

  <!-- pills -->
  <g font-size="17" font-weight="600">
    <rect x="322" y="252" rx="14" width="118" height="30" fill="#7C5CFF" opacity="0.22"/>
    <text x="348" y="273" fill="#C4B5FD">Rust</text>
    <rect x="452" y="252" rx="14" width="150" height="30" fill="#22D3EE" opacity="0.16"/>
    <text x="470" y="273" fill="#A5F3FC">llama.cpp</text>
    <rect x="614" y="252" rx="14" width="140" height="30" fill="#34D399" opacity="0.14"/>
    <text x="636" y="273" fill="#A7F3D0">offline</text>
  </g>
</svg>
